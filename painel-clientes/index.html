<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Clientes - CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../shared/global.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="min-h-screen antialiased flex flex-col">

  <!-- Topbar -->
  <header class="painel-header backdrop-blur sticky top-0 z-20">
    <div class="max-w-[1680px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg painel-icone-topo flex items-center justify-center text-sm">
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="flex items-center gap-2.5">
          <h1 class="font-semibold text-sm sm:text-base tracking-tight text-[#e6ebf2]">Painel de Clientes</h1>
          <span id="modoConexao" class="text-xs text-[#9aa5b8]">Conectando...</span>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <div class="seletor-view p-0.5 rounded-lg flex items-center text-xs">
          <button id="btnColunas" onclick="setView('colunas')" class="btn-view active">
            <i class="fa-solid fa-table-columns"></i>
            <span class="hidden sm:inline">Colunas</span>
          </button>
          <button id="btnLista" onclick="setView('lista')" class="btn-view">
            <i class="fa-solid fa-list"></i>
            <span class="hidden sm:inline">Lista</span>
          </button>
        </div>

        <button onclick="abrirModal()" class="btn-primario font-semibold px-3.5 py-1.5 rounded-lg text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>Novo cliente</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Sub-barra Busca e Resumo -->
  <div class="max-w-[1680px] w-full mx-auto px-4 sm:px-6 pt-4 pb-3 flex flex-wrap items-center justify-between gap-3">
    <div class="relative flex-1 min-w-[240px] max-w-md">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-[#687387] text-xs"></i>
      <input
        type="text"
        id="campoBusca"
        oninput="renderizar()"
        placeholder="Buscar por nome, WhatsApp ou e-mail..."
        class="input-crm pl-9"
      />
    </div>

    <div class="text-xs text-[#9aa5b8] flex flex-wrap items-center gap-2.5">
      <span>Clientes ativos: <strong id="contadorTotal" class="text-[#e6ebf2] font-semibold">0</strong></span>
      <span class="text-[#232a3b]">•</span>
      <span id="badgeEpoca" class="badge-epoca px-2 py-0.5 rounded-md font-medium"></span>
      <span class="text-[#232a3b]">•</span>
      <span class="text-[#9aa5b8]"><i class="fa-solid fa-circle-info text-[#687387] mr-1"></i>"Sem Resposta" remove o registro</span>
    </div>
  </div>

  <!-- Área Principal -->
  <main class="max-w-[1680px] w-full mx-auto px-4 sm:px-6 pb-8 flex-1">
    <div id="viewColunas" class="flex gap-3.5 overflow-x-auto pb-4 items-start min-h-[540px] custom-scroll"></div>

    <div id="viewLista" class="hidden painel-surface rounded-xl overflow-hidden">
      <div class="overflow-x-auto custom-scroll">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-[#232a3b] bg-[#0e121a] text-[11px] uppercase tracking-wider text-[#9aa5b8]">
              <th class="py-3 px-4 font-medium">Cliente</th>
              <th class="py-3 px-4 font-medium">WhatsApp</th>
              <th class="py-3 px-4 font-medium">Tentativas Zap (10h–18h)</th>
              <th class="py-3 px-4 font-medium">E-mail</th>
              <th class="py-3 px-4 font-medium">Etapa</th>
              <th class="py-3 px-4 font-medium text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tbodyLista" class="divide-y divide-[#232a3b]/70 text-sm"></tbody>
        </table>
      </div>
      <div id="vazioLista" class="hidden py-12 text-center text-[#687387] text-sm">
        Nenhum cliente encontrado para o filtro atual.
      </div>
    </div>
  </main>

  <!-- Modal Ficha -->
  <div id="modalCliente" class="fixed inset-0 bg-black/70 backdrop-blur-[2px] hidden items-center justify-center p-4 z-50">
    <div class="modal-caixa rounded-xl w-full max-w-lg p-6 shadow-2xl max-h-[92vh] overflow-y-auto custom-scroll">
      <div class="flex items-center justify-between mb-5 pb-3 border-b border-[#232a3b]">
        <h2 id="modalTitulo" class="text-base font-semibold text-[#e6ebf2]">Novo Cliente</h2>
        <button onclick="fecharModal()" class="text-[#9aa5b8] hover:text-[#e6ebf2] cursor-pointer p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="formCliente" onsubmit="salvarCliente(event)" class="space-y-4">
        <input type="hidden" id="clienteId" />

        <div>
          <label class="block text-xs font-medium text-[#9aa5b8] mb-1.5">Nome completo *</label>
          <input type="text" id="nome" required placeholder="Ex: Carlos Eduardo Almeida" class="input-crm" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-[#9aa5b8] mb-1.5">WhatsApp *</label>
            <input type="tel" id="whatsapp" required oninput="mascaraTelefone(this)" placeholder="(11) 99999-9999" maxlength="15" class="input-crm" />
          </div>

          <div>
            <label class="block text-xs font-medium text-[#9aa5b8] mb-1.5">E-mail</label>
            <input type="email" id="email" placeholder="cliente@empresa.com.br" class="input-crm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-[#9aa5b8] mb-1.5">Etapa do funil</label>
          <select id="status" class="input-crm">
            <option value="Leads">Leads</option>
            <option value="Contato">Contato</option>
            <option value="Respondeu">Respondeu</option>
            <option value="Interessado">Interessado</option>
            <option value="Documentos">Documentos</option>
            <option value="Pós-Venda">Pós-Venda</option>
            <option value="Sem Interesse">Sem Interesse</option>
            <option value="Sem Resposta">Sem Resposta (apaga ao salvar)</option>
          </select>
        </div>

        <div class="bg-[#0e121a] border border-[#232a3b] rounded-xl p-3.5">
          <div class="flex items-center justify-between mb-2.5">
            <label class="text-xs font-medium text-[#e6ebf2]">
              <i class="fa-brands fa-whatsapp text-[#10b981] mr-1.5"></i>
              Tentativas de contato (10h às 18h)
            </label>
            <span id="modalContadorTentativas" class="text-xs font-semibold text-[#6ee7b7]">0/10</span>
          </div>
          <div id="modalGradeTentativas" class="grid grid-cols-5 gap-2"></div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#232a3b]">
          <button type="button" onclick="fecharModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-[#9aa5b8] hover:text-[#e6ebf2] hover:bg-[#171c28] cursor-pointer transition">
            Cancelar
          </button>
          <button type="submit" class="btn-primario font-semibold px-4 py-2 rounded-lg text-xs cursor-pointer">
            Salvar ficha
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Disparar Zap com Prévia -->
  <div id="modalZap" class="fixed inset-0 bg-black/75 backdrop-blur-[2px] hidden items-center justify-center p-4 z-50">
    <div class="modal-caixa rounded-xl w-full max-w-md p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-[#232a3b]">
        <div>
          <h3 id="zapTitulo" class="font-semibold text-sm text-[#e6ebf2]">Enviar mensagem no WhatsApp</h3>
          <p id="zapSubtitulo" class="text-xs text-[#9aa5b8] mt-0.5"></p>
        </div>
        <button onclick="fecharModalZap()" class="text-[#9aa5b8] hover:text-[#e6ebf2] cursor-pointer p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <textarea id="zapTexto" rows="6" class="input-crm resize-none custom-scroll leading-relaxed"></textarea>

      <div class="mt-4 flex items-center justify-between gap-2">
        <button type="button" id="btnSoMarcarZap"
          class="px-3 py-2 rounded-lg text-xs font-medium bg-[#171c28] hover:bg-[#1c2231] text-[#e6ebf2] border border-[#232a3b] cursor-pointer transition">
          Apenas registrar tentativa
        </button>
        <div class="flex items-center gap-2">
          <button type="button" onclick="fecharModalZap()" class="px-3 py-2 rounded-lg text-xs text-[#9aa5b8] hover:text-[#e6ebf2] cursor-pointer">
            Fechar
          </button>
          <button type="button" id="btnAbrirZapAgora"
            class="btn-primario font-semibold px-3.5 py-2 rounded-lg text-xs flex items-center gap-1.5 cursor-pointer">
            <i class="fa-brands fa-whatsapp text-sm"></i>
            Abrir WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
